org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# SmartWaste AI configuration (non-secret).
# The OpenRouter API key is a SECRET: put it in local.properties, never here.
#
# Model chains are tried in order. OpenRouter fails over server-side between
# them, the app retries each model client-side, and if every cloud model fails
# the app falls back to on-device ML Kit image labelling.
# ---------------------------------------------------------------------------
SMARTWASTE_VISION_MODELS=google/gemini-3.5-flash,google/gemini-2.5-flash,openrouter/free
SMARTWASTE_CHAT_MODELS=google/gemini-3.5-flash,google/gemini-2.5-flash,openrouter/free

# Optional: data.gov.sg dataset id (looks like d_xxxxxxxx) for NEA's
# "E-waste Recycling (GEOJSON)" dataset. Leave blank to skip that source.
SMARTWASTE_DATAGOV_EWASTE_DATASET_ID=
